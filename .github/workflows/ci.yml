name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: |
          python - <<'PY'
          import os
          import secrets
          import pytest

          os.environ["SECRET_KEY"] = secrets.token_urlsafe(32)
          os.environ["DB_PASSWORD"] = secrets.token_urlsafe(16)
          os.environ["ADMIN_API_KEY"] = "test-admin-key-for-ci"
          raise SystemExit(pytest.main(["tests/", "-v"]))
          PY

  test-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: notify
      - name: Run tests
        run: npm test
        working-directory: notify

  chart-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/vulntracker
      - name: Render chart
        run: helm template vulntracker helm/vulntracker --namespace vulntracker

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit
      - name: Scan application source
        run: |
          mkdir -p reports
          bandit -r app/ -f json -o reports/sast.bandit.json --exit-zero
      - uses: actions/upload-artifact@v4
        with:
          name: sast.bandit.json
          path: reports/sast.bandit.json

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit and scan dependencies  
        run: |
          pip install pip-audit
          mkdir -p reports
          pip-audit -f json > reports/sca.pip-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sca.pip-audit.json
          path: reports/sca.pip-audit.json

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag vulntracker:ci . || true
      - name: Scan container image with Trivy (report-only)  
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image: vulntracker:ci
          format: json
          output: reports/container.trivy.json
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: reports/container.trivy.json

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Render chart
        run: helm template vulntracker helm/vulntracker > rendered.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install checkov
      - name: Scan rendered manifests
        run: |
          mkdir -p reports
          checkov -f rendered.yaml --framework kubernetes --output json --soft-fail > reports/iac.checkov.json
      - uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: reports/iac.checkov.json

  helm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/vulntracker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install checkov
      - name: Scan Helm chart with Checkov (soft-fail)
        run: |
          mkdir -p reports
          checkov --framework helm -d helm/vulntracker --output json --soft-fail > reports/iac.checkov.json
      - uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: reports/iac.checkov.json