name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python - <<'PY'
          import os
          import secrets
          import pytest

          os.environ["SECRET" + "_KEY"] = secrets.token_urlsafe(32)
          raise SystemExit(pytest.main(["tests/", "-v"]))
          PY

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # TODO (candidates): Add the following security scanning jobs.
  # Tool selection is your decision — document your choices in findings.md.
  #
  # sast:
  #   Static Application Security Testing against app/ source code
  #   Upload JSON report as a build artifact named sast.<tool>.json
  #   Build should fail on critical findings
  #
  # sca:
  #   Dependency / Software Composition Analysis against requirements.txt
  #   Upload JSON report as a build artifact named sca.<tool>.json
  #   Build should fail on critical or high severity CVEs
  #
  # container-scan:
  #   Build the Docker image, then scan it for vulnerabilities and misconfigurations
  #   Upload JSON report as a build artifact named container.<tool>.json
  #
  # iac-scan:
  #   Scan the Helm chart or Terraform configuration for security misconfigurations
  #   Upload JSON report as a build artifact named iac.<tool>.json

  chart-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/vulntracker

      - name: Render chart
        run: helm template vulntracker helm/vulntracker --namespace vulntracker

  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan application source
        run: |
          mkdir -p reports
          semgrep scan --config p/security-audit --severity ERROR --error \
            --json --output reports/sast.semgrep.json app

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast.semgrep.json
          path: reports/sast.semgrep.json
          if-no-files-found: warn

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: reports/sca.trivy.json
          exit-code: "0"

      - name: Fail on high or critical vulnerabilities
        run: |
          python - <<'PY'
          import json
          import sys

          with open("reports/sca.trivy.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          counts = {"HIGH": 0, "CRITICAL": 0}
          for result in report.get("Results", []):
              for finding in result.get("Vulnerabilities") or []:
                  severity = (finding.get("Severity") or "").upper()
                  if severity in counts:
                      counts[severity] += 1

          print(f"High: {counts['HIGH']}; critical: {counts['CRITICAL']}")
          sys.exit(1 if sum(counts.values()) else 0)
          PY

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca.trivy.json
          path: reports/sca.trivy.json
          if-no-files-found: warn

  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag vulntracker:ci .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: vulntracker:ci
          format: json
          output: reports/container.trivy.json
          exit-code: "0"

      - name: Upload container report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: reports/container.trivy.json
          if-no-files-found: warn

  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Helm chart
        run: |
          mkdir -p reports
          checkov -d helm/vulntracker --framework helm --output json \
            --soft-fail > reports/iac.checkov.json

      - name: Upload IaC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: reports/iac.checkov.json
          if-no-files-found: warn
