name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python - <<'PY'
          import os
          import secrets
          import pytest

          os.environ["SECRET_KEY"] = secrets.token_urlsafe(32)
          os.environ["DB_PASSWORD"] = secrets.token_urlsafe(16)
          os.environ["ADMIN_API_KEY"] = "test-admin-key-for-ci"
          raise SystemExit(pytest.main(["tests/", "-v"]))
          PY

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # TODO (candidates): Add the following security scanning jobs.
  # Tool selection is your decision — document your choices in findings.md.
  #
  # sast:
  #   Static Application Security Testing against app/ source code
  #   Upload JSON report as a build artifact named sast.<tool>.json
  #   Build should fail on critical findings
  #
  # sca:
  #   Dependency / Software Composition Analysis against requirements.txt
  #   Upload JSON report as a build artifact named sca.<tool>.json
  #   Build should fail on critical or high severity CVEs
  #
  # container-scan:
  #   Build the Docker image, then scan it for vulnerabilities and misconfigurations
  #   Upload JSON report as a build artifact named container.<tool>.json
  #
  # iac-scan:
  #   Scan the Helm chart or Terraform configuration for security misconfigurations
  #   Upload JSON report as a build artifact named iac.<tool>.json

  chart-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/vulntracker

      - name: Render chart
        run: helm template vulntracker helm/vulntracker --namespace vulntracker

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "bandit==${BANDIT_VERSION}"
      - name: Scan (full report)
        run: bandit -r app/ -f json -o reports/sast.bandit.json --exit-zero
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast.bandit.json
          path: reports/sast.bandit.json
      - name: Gate on HIGH severity
        run: |
          n=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' reports/sast.bandit.json)
          echo "HIGH findings: $n"
          [ "$n" -eq 0 ]
      - name: Scan application source
        run: |
          mkdir -p reports
          # -ll fails only on medium or high severity
          bandit -ll -f json -o reports/sast.bandit.json --recursive app

  sca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit and scan dependencies  
        run: |
          pip install pip-audit || true
          mkdir -p reports
          pip-audit -f json > reports/sca.pip-audit.json || true
      - name: Audit shipped dependencies
        run: |
          mkdir -p reports
          pip-audit -r requirements-runtime.txt -f json -o reports/sca.pip-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca.pip-audit.json
          path: reports/sca.pip-audit.json
      - name: Gate on known vulnerabilities
        run: |
          jq -e '.dependencies != null' reports/sca.pip-audit.json > /dev/null
          n=$(jq '[.dependencies[] | select((.vulns | length) > 0)] | length' reports/sca.pip-audit.json)
          echo "Packages with known vulns: $n"
          [ "$n" -eq 0 ]

  container-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t vulntracker:ci .
      - run: docker save vulntracker:ci -o image.tar
      - name: Scan image
        run: |
          docker run --rm -v "$PWD:/work" -w /work "aquasec/trivy:${TRIVY_VERSION}" \
            image --input image.tar --scanners vuln,misconfig \
            --format json --output reports/container.trivy.json --exit-code 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container.trivy.json
          path: reports/container.trivy.json
      - name: Build container image
        run: docker build --tag vulntracker:ci . || true
      - name: Scan container image with Trivy (report-only)  
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image: vulntracker:ci
          format: json
          output: reports/container.trivy.json
          exit-code: "0"
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Render chart
        run: helm template vulntracker helm/vulntracker > rendered.yaml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install checkov
      - name: Scan rendered manifests
        run: |
          mkdir -p reports
          checkov -f rendered.yaml --framework kubernetes --output json --soft-fail > reports/iac.checkov.json
      - name: Upload IaC report
        uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: reports/iac.checkov.json
  helm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: |
          mkdir -p reports
          helm lint helm/vulntracker

      # Checkov only; skip IaC dependency pull issues
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install checkov

      - name: Scan Helm chart with Checkov (soft-fail)
        run: |
          mkdir -p reports
          checkov --framework helm -d helm/vulntracker --output json --soft-fail > reports/iac.checkov.json

      - name: Upload IaC report
        uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: reports/iac.checkov.json